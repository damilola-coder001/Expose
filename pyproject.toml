[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expose-security"
version = "0.1.0"
description = "Expose: Production-oriented website security intelligence platform"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Expose Security Intelligence" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "dnspython>=2.6.1",
    "cryptography>=43.0.0",
    "pydantic>=2.8.0",
    "rich>=13.8.0",
    "click>=8.1.7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0"
]

[project.scripts]
expose = "expose.cli.main:cli"

[tool.vercel]
# Point at the concrete module file rather than the package initializer.
# This prevents Vercel from attempting to import ``expose/api/__init__.py``
# as a handler path.
entrypoint = "expose.api.app:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["expose*"]
